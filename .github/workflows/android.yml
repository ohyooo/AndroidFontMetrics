name: Android CI

on:
  push:
  repository_dispatch:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  actions: write
  contents: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@main
        with:
          submodules: recursive
     
      - name: Setup JDK
        uses: actions/setup-java@main
        with:
          distribution: 'jetbrains'
          java-version: '21'
          java-package: jdk
          cache: 'gradle'

      - name: Build Release AAB
        run: chmod +x gradlew && ./gradlew :app:bundleRelease

      - name: Generate four signed ABI APKs from AAB
        shell: bash
        run: |
          bash .github/scripts/build-abi-apks.sh app AndroidFontMetrics

      - name: Upload arm64-v8a APK without ZIP wrapping
        uses: actions/upload-artifact@v7
        with:
          path: ci-output/abi-apks/AndroidFontMetrics-arm64-v8a.apk
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload armeabi-v7a APK without ZIP wrapping
        uses: actions/upload-artifact@v7
        with:
          path: ci-output/abi-apks/AndroidFontMetrics-armeabi-v7a.apk
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload x86 APK without ZIP wrapping
        uses: actions/upload-artifact@v7
        with:
          path: ci-output/abi-apks/AndroidFontMetrics-x86.apk
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload x86_64 APK without ZIP wrapping
        uses: actions/upload-artifact@v7
        with:
          path: ci-output/abi-apks/AndroidFontMetrics-x86_64.apk
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload retrace mapping without ZIP wrapping
        if: ${{ hashFiles('ci-output/abi-apks/AndroidFontMetrics-mapping.txt') != '' }}
        uses: actions/upload-artifact@v7
        with:
          path: ci-output/abi-apks/AndroidFontMetrics-mapping.txt
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Remove old Releases
        uses: dev-drprasad/delete-older-releases@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          keep_latest: 3
          delete_tags: true

      - name: Delete workflow runs
        uses: GitRML/delete-workflow-runs@main
        with:
          retain_days: 3
          keep_minimum_runs: 2

